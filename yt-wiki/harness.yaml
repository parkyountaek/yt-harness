schema: 1
id: yt-wiki
version: 0.1.0
purpose: Knowledge vault: capture notes and answer from them
description: "Knowledge vault harness: capture notes into a vault and answer questions from it"
tools: []
folderKind: vault          # yt-spawn --vault <name>; vaults are listed in ~/yt-local/config.json
permissions: write
sandbox:                   # the session can write the vault and its out/, nothing else
  read: ["<task-folder>", "<vault>"]
  write: ["<task-folder>/out/", "<vault>"]
deadlineDefault: 1h
evals: []
runtimes: []               # list only runtimes that passed the equivalence tests
experimental: true
