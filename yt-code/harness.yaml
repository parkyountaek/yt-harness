schema: 1
id: yt-code
version: 0.2.2
purpose: Code change on a private clone of a repository
description: "Code change harness: works on a private clone, commits on branch yt/<task id>, never pushes"
tools: [git]
folderKind: worktree       # yt-spawn --repo <name>; repositories are listed in ~/yt-local/config.json
permissions: write
sandbox:                   # the clone and out/ are writable; the source repository is never mounted
  read: ["<task-folder>"]
  write: ["<task-folder>/out/", "<repo>"]
workload: standard            # a scoped change with tests; the model is the human's choice (yt model)
deadlineDefault: 2h
evals: ["evals/result.py"]
runtimes: [claude, codex]   # passed the contract tests and live evals on both
experimental: false
